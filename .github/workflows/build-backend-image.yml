name: build-backend-image

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build web bundle
        working-directory: frontend
        env:
          VITE_ASSET_PREFIX: /
          VITE_SKIP_LICENSE_CHECKS: 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:scripts
          cd apps/web && pnpm build

      - name: Stage web artifacts for the image
        run: |
          mkdir -p backend/.build/web
          cp -R frontend/apps/web/dist/. backend/.build/web/

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tier0-edge:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
